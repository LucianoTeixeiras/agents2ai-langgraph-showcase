[project]
name = "agents2ai-langgraph-showcase"
version = "0.0.1"
description = "Agente LangGraph NL→SQL sobre dados públicos (Agents2AI showcase)"
readme = "README.md"
license = "MIT"
authors = [{ name = "Luciano Teixeira", email = "luciano.teixeiras@gmail.com" }]
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/showcase"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
